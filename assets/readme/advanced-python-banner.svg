<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Advanced Python — concepts, libraries, notebooks and datasets" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Advanced Python</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="1" stop-color="#0e1235"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.1" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#8b4dff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#8b4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="py" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4f7bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6c63ff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowL)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowR)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#6c63ff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Title block -->
  <text x="64" y="68" fill="#22d3ee" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">NOTEBOOKS  ·  LIBRARIES  ·  DATA</text>
  <text x="62" y="126" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="3" textLength="300" lengthAdjust="spacingAndGlyphs">ADVANCED</text>
  <text x="60" y="206" fill="url(#py)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="800" textLength="360" lengthAdjust="spacingAndGlyphs">PYTHON</text>
  <text x="64" y="246" fill="#b3bddb" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" textLength="420" lengthAdjust="spacingAndGlyphs">Concepts, libraries, notebooks &amp; datasets</text>

  <!-- Terminal -->
  <g transform="translate(640 40)">
    <rect width="340" height="172" rx="14" fill="#0a0f26" stroke="#4f7bff" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M0 14 a14 14 0 0 1 14 -14 H326 a14 14 0 0 1 14 14 V34 H0 Z" fill="#141b44"/>
    <circle cx="20" cy="17" r="5" fill="#ff6584"/>
    <circle cx="38" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="17" r="5" fill="#22d3a5"/>
    <text x="320" y="21" text-anchor="end" fill="#7c8cc4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12">python</text>
    <g font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="15">
      <text x="18" y="60"><tspan fill="#22d3ee">&gt;&gt;&gt;</tspan><tspan fill="#a06bff"> import</tspan><tspan fill="#e8eeff"> numpy </tspan><tspan fill="#a06bff">as</tspan><tspan fill="#e8eeff"> np</tspan></text>
      <text x="18" y="84"><tspan fill="#22d3ee">&gt;&gt;&gt;</tspan><tspan fill="#a06bff"> import</tspan><tspan fill="#e8eeff"> pandas </tspan><tspan fill="#a06bff">as</tspan><tspan fill="#e8eeff"> pd</tspan></text>
      <text x="18" y="108"><tspan fill="#22d3ee">&gt;&gt;&gt;</tspan><tspan fill="#e8eeff"> df = pd.read_csv(</tspan><tspan fill="#22d3a5">"data.csv"</tspan><tspan fill="#e8eeff">)</tspan></text>
      <text x="18" y="132"><tspan fill="#22d3ee">&gt;&gt;&gt;</tspan><tspan fill="#e8eeff"> df.head()</tspan></text>
      <text x="18" y="156"><tspan fill="#22d3ee">&gt;&gt;&gt;</tspan></text>
      <rect x="60" y="143" width="9" height="16" fill="#22d3ee" opacity="0.85"/>
    </g>
  </g>

  <!-- Notebook card -->
  <g transform="translate(1004 36)">
    <rect width="166" height="112" rx="12" fill="#0a0f26" stroke="#8b4dff" stroke-opacity="0.75" stroke-width="2"/>
    <text x="14" y="24" fill="#a06bff" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">In [1]:</text>
    <rect x="14" y="32" width="138" height="26" rx="5" fill="#141b44"/>
    <rect x="22" y="42" width="70" height="5" rx="2.5" fill="#22d3ee"/>
    <rect x="22" y="50" width="44" height="4" rx="2" fill="#7c8cc4"/>
    <text x="14" y="78" fill="#a06bff" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="700">In [2]:</text>
    <rect x="14" y="84" width="138" height="18" rx="5" fill="#141b44"/>
    <rect x="22" y="91" width="90" height="5" rx="2.5" fill="#4f7bff"/>
  </g>

  <!-- Data chart card -->
  <g transform="translate(1004 160)">
    <rect width="166" height="104" rx="12" fill="#0a0f26" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <g fill="url(#bar)">
      <rect x="20" y="60" width="16" height="28" rx="3"/>
      <rect x="44" y="42" width="16" height="46" rx="3"/>
      <rect x="68" y="52" width="16" height="36" rx="3"/>
      <rect x="92" y="26" width="16" height="62" rx="3"/>
      <rect x="116" y="38" width="16" height="50" rx="3"/>
    </g>
    <path d="M16 92 H150" stroke="#7c8cc4" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M20 64 L52 48 L76 56 L100 30 L124 42" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- File-type chips -->
  <g font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle">
    <g transform="translate(640 232)"><rect width="70" height="30" rx="15" fill="#4f7bff" fill-opacity="0.16" stroke="#4f7bff" stroke-width="1.5"/><text x="35" y="20" fill="#9db6ff">.py</text></g>
    <g transform="translate(722 232)"><rect width="100" height="30" rx="15" fill="#8b4dff" fill-opacity="0.16" stroke="#8b4dff" stroke-width="1.5"/><text x="50" y="20" fill="#c4a8ff">.ipynb</text></g>
    <g transform="translate(834 232)"><rect width="70" height="30" rx="15" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-width="1.5"/><text x="35" y="20" fill="#7ee8f7">.csv</text></g>
    <g transform="translate(916 232)"><rect width="64" height="30" rx="15" fill="#22d3a5" fill-opacity="0.14" stroke="#22d3a5" stroke-width="1.5"/><text x="32" y="20" fill="#6ff0cf">.json</text></g>
  </g>

  <!-- sparkles -->
  <g fill="#22d3ee"><circle cx="590" cy="48" r="3" opacity="0.8"/><circle cx="1185" cy="200" r="2.5" opacity="0.6"/><circle cx="600" cy="276" r="2" opacity="0.5"/></g>
  <g fill="#8b4dff"><circle cx="990" cy="276" r="3" opacity="0.7"/><circle cx="1180" cy="22" r="2.5" opacity="0.7"/></g>
</svg>
